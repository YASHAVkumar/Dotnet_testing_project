name: CD - Promote to Master

on:
  workflow_run:
    workflows:
      - "Build and Test"
    types:
      - completed

# Required so Actions can read the artifact
# and push the deployment files to master.
permissions:
  actions: read
  contents: write


jobs:

  deploy:

    # ==========================================
    # Only continue when:
    #
    # 1. CI succeeded
    # 2. CI was triggered by push
    # 3. Push was to main
    # ==========================================

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # Checkout MASTER
      # ==========================================

      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0


      # ==========================================
      # Download Artifact From CI
      # ==========================================

      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: testing-api
          path: ./artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}


      # ==========================================
      # Show Artifact
      # ==========================================

      - name: Show Artifact
        run: |
          echo "Artifact contents:"
          find ./artifact -type f


      # ==========================================
      # Configure Git
      # ==========================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================
      # Replace Master With Artifact
      # ==========================================

      - name: Replace Master With Artifact
        run: |

          # Remove existing deployment files
          # but keep .git directory
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "artifact" \
            -exec rm -rf {} \;

          # Copy published application
          cp -R ./artifact/. ./


      # ==========================================
      # Remove Temporary Artifact Directory
      # ==========================================

      - name: Remove Artifact Folder
        run: |
          rm -rf ./artifact


      # ==========================================
      # Show Master Contents
      # ==========================================

      - name: Show Deployment Files
        run: |
          echo "Files going to master:"
          ls -la


      # ==========================================
      # Commit Deployment
      # ==========================================

      - name: Commit Deployment
        run: |

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit \
            -m "Deploy testing-api from CI run ${{ github.event.workflow_run.id }}"


      # ==========================================
      # Push To MASTER
      # ==========================================

      - name: Push To Master
        run: |
          git push origin master