name: Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest

        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrongPassword123!

        ports:
          - 1433:1433

        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P YourStrongPassword123!
          -C
          -Q 'SELECT 1'
          || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Product Web Tests
        run: dotnet build --no-restore

      - name: Run migrations
        run: |
          dotnet ef database update \
            --project testing.web \
            --connection "Server=localhost,1433;Database=TestingProductWebDb_Test;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      - name: Run tests 
        env:
          TEST_CONNECTION_STRING: "Server=localhost,1433;Database=TestingProductWebDb_Test;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"
        run: dotnet test testing.product.web.tests/testing.product.web.tests.csproj --no-build